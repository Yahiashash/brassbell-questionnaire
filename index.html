<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Brassbell × dough client questionnaire">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Brassbell Client Questionnaire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Alexandria:wght@400;600&display=swap">
<style>
/* layout: one phone-sized column, one section per screen, sticky progress on top, thumb-reach nav at the bottom */
:root{
  --ink:#122940;        /* dough navy */
  --water:#457D9E;      /* dough blob blue */
  --sparkle:#C4D9EB;    /* soft blue */
  --paper:#FFFCF7;      /* dough cream */
  --card:#FFFFFF;
  --line:#DCE6EF;
  --muted:#4F6377;
  --brass:#B8893A;      /* nod to the bell */
  --on-ink:#FFFCF7;
  --chip:#EEF4FA;
  --font:"Montserrat","Alexandria",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#F3EEE4;--water:#7FB2D1;--sparkle:#2A4763;--paper:#0E1F31;--card:#14293F;--line:#264058;--muted:#A9BBCB;--brass:#D7AE62;--on-ink:#0E1F31;--chip:#1A3350;color-scheme:dark}}
:root[data-theme="dark"]{
  --ink:#F3EEE4;--water:#7FB2D1;--sparkle:#2A4763;--paper:#0E1F31;--card:#14293F;--line:#264058;--muted:#A9BBCB;--brass:#D7AE62;--on-ink:#0E1F31;--chip:#1A3350;color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button,input,textarea{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{padding-block:12px 10px;display:flex;flex-direction:column;gap:10px}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{height:22px;width:auto;display:block}
.logo .ink{fill:var(--ink)}.logo .mark{fill:var(--water)}
.pair{font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--muted);text-align:right;line-height:1.3}
.pair b{color:var(--ink);font-weight:700}
.prog{display:flex;align-items:center;gap:10px}
.segs{flex:1;display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.seg{height:6px;border-radius:99px;background:var(--line);overflow:hidden;position:relative}
.seg i{position:absolute;inset:0;width:0;background:var(--water);border-radius:inherit;transition:width .35s ease}
.seg.here{outline:2px solid var(--sparkle);outline-offset:1px}
.count{font-size:11.5px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.bell{width:22px;height:22px;flex:none;transform-origin:50% 12%}
.bell path,.bell circle{fill:var(--brass)}
.ring{animation:ring .9s ease}
@keyframes ring{0%{transform:rotate(0)}15%{transform:rotate(22deg)}30%{transform:rotate(-18deg)}45%{transform:rotate(12deg)}60%{transform:rotate(-8deg)}75%{transform:rotate(4deg)}100%{transform:rotate(0)}}

/* screens */
main{overflow-x:clip;padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
.screen{padding-block:22px 8px;display:flex;flex-direction:column;gap:18px}
.hero{position:relative;display:flex;flex-direction:column;gap:8px;padding-block:6px 4px}
.blob{position:absolute;right:-28px;top:-6px;width:150px;height:auto;z-index:0;opacity:.95}
.blob path{fill:var(--sparkle)}
.hero>*:not(.blob){position:relative;z-index:1}
.eyebrow{font-size:12px;font-weight:600;color:var(--water);letter-spacing:.04em}
h1{font-size:clamp(30px,8.6vw,40px);line-height:1.04;font-weight:800;letter-spacing:-.02em;margin:0;text-wrap:balance}
h2{font-size:clamp(26px,7.4vw,34px);line-height:1.08;font-weight:800;letter-spacing:-.02em;margin:0;text-wrap:balance}
.sub{font-size:15px;color:var(--muted);margin:0;max-width:34ch}
.nudge{font-size:13.5px;background:var(--sparkle);color:var(--ink);border-radius:16px;padding:12px 14px;margin:0}
:root:not([data-theme="light"]) .nudge{color:var(--ink)}

/* question card */
.q{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
.q.done{border-color:color-mix(in srgb,var(--water) 45%,var(--line))}
.qhead{display:flex;gap:10px;align-items:flex-start}
.qn{font-size:12px;font-weight:700;color:var(--water);padding-top:3px;font-variant-numeric:tabular-nums;flex:none;width:20px}
.qt{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.qt h3{font-size:16.5px;line-height:1.3;font-weight:700;margin:0;text-wrap:balance}
.qt p{font-size:13px;color:var(--muted);margin:0}
.star{flex:none;font-size:10.5px;font-weight:700;letter-spacing:.03em;background:var(--sparkle);color:var(--ink);border-radius:99px;padding:3px 9px;margin-top:2px;white-space:nowrap}
.tick{flex:none;width:22px;height:22px;border-radius:50%;background:var(--water);color:var(--on-ink);display:grid;place-items:center;font-size:12px;font-weight:800;transform:scale(0);transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.q.done .tick{transform:scale(1)}
.glabel{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.03em;margin:4px 0 -4px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;border:1.5px solid var(--line);background:var(--chip);border-radius:99px;padding:10px 14px;min-height:44px;font-size:14px;font-weight:500;line-height:1.25;text-align:left;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:background .15s,border-color .15s,transform .1s;max-width:100%}
.chip:active{transform:scale(.97)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.chip[aria-pressed="true"]::before{content:"✓";font-weight:800;font-size:12px}
.chip.other{border-style:dashed;background:transparent}
.chip.other[aria-pressed="true"]{background:var(--ink);border-style:solid}
.chip[disabled]{opacity:.4;cursor:not-allowed}
.chip:focus-visible,.btn:focus-visible,input:focus-visible,textarea:focus-visible,.mode:focus-visible{outline:3px solid var(--water);outline-offset:2px}
.limit{font-size:12px;color:var(--muted);margin:-4px 0 0}

input[type=text],input[type=date],textarea{width:100%;border:1.5px solid var(--line);background:var(--paper);border-radius:14px;padding:12px 14px;font-size:15px;min-height:46px}
textarea{min-height:92px;resize:vertical;line-height:1.45}
input::placeholder,textarea::placeholder{color:color-mix(in srgb,var(--muted) 75%,transparent)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12.5px;font-weight:600;color:var(--muted)}
.notelabel{font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:-6px}

/* intro */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{appearance:none;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:18px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.mode b{font-size:16px;font-weight:800}
.mode span{font-size:12.5px;color:var(--muted)}
.mode[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.howto{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.howto li{display:flex;gap:10px;font-size:14px;align-items:flex-start}
.howto li span:first-child{flex:none;width:24px;height:24px;border-radius:50%;background:var(--sparkle);display:grid;place-items:center;font-size:12px;font-weight:700}
.meta{display:grid;gap:12px}

/* checklist */
.checks{display:flex;flex-direction:column;gap:8px}
.check{appearance:none;width:100%;text-align:left;display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;cursor:pointer}
.check .box{flex:none;width:22px;height:22px;border-radius:7px;border:2px solid var(--water);display:grid;place-items:center;margin-top:1px;font-size:13px;font-weight:800;color:transparent}
.check[aria-pressed="true"]{border-color:var(--water)}
.check[aria-pressed="true"] .box{background:var(--water);color:var(--on-ink)}
.check b{display:block;font-size:14.5px;font-weight:700}
.check small{display:block;font-size:12.5px;color:var(--muted)}

/* done */
.done-hero{align-items:center;text-align:center;padding-top:18px}
.bigbell{width:84px;height:84px;transform-origin:50% 12%}
.bigbell path,.bigbell circle{fill:var(--brass)}
.done-hero .sub{margin-inline:auto}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center}
.stat b{display:block;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--muted)}
.actions{display:flex;flex-direction:column;gap:10px}
.mail{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;font-size:14px}
.mail code{font-family:var(--font);font-weight:700;user-select:all;word-break:break-all}
.preview{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;font-size:12.5px;line-height:1.5;white-space:pre-wrap;max-height:260px;overflow:auto;color:var(--muted)}
.missing{font-size:13px;color:var(--muted);margin:0}
.missing button{appearance:none;border:0;background:none;color:var(--water);font-weight:700;text-decoration:underline;cursor:pointer;padding:0}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--paper) 94%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .wrap{padding-block:12px;display:flex;gap:10px;align-items:center}
.btn{appearance:none;border:0;border-radius:99px;min-height:50px;padding:0 22px;font-size:15px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.primary{background:var(--ink);color:var(--paper);flex:1}
.btn.ghost{background:var(--chip);color:var(--ink)}
.btn.wa{background:#1F8F4E;color:#fff}
.btn.full{width:100%}
.btn[hidden]{display:none}
.saved{font-size:11.5px;color:var(--muted);text-align:center;margin:0}
.wave{display:block;width:100%;height:auto;margin-top:8px}
.wave .w{fill:var(--sparkle)}.wave .b{fill:var(--water)}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:99px;font-size:13.5px;font-weight:600;z-index:9;transition:.25s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.fade{animation:fade .35s ease both}
@keyframes fade{from{opacity:.4;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* sidebar: hidden on phones */
.side{display:none}
.kbd{display:none}
@media (min-width:900px){
  body{font-size:15.5px}
  .top .wrap{max-width:1120px}
  .shell{max-width:1120px;margin:0 auto;display:grid;grid-template-columns:250px minmax(0,1fr);gap:48px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
  .shell>main.wrap{max-width:700px;margin:0;padding-left:0;padding-right:0}
  .side{display:flex;flex-direction:column;gap:6px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 112px);align-self:start;padding-block:28px}
  .side h4{margin:0 0 6px;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .sitem{appearance:none;border:0;background:transparent;text-align:left;display:grid;grid-template-columns:26px 1fr auto;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;cursor:pointer;color:var(--ink)}
  .sitem:hover{background:var(--chip)}
  .sitem[aria-current="step"]{background:var(--card);box-shadow:inset 0 0 0 1.5px var(--line)}
  .sitem:focus-visible{outline:3px solid var(--water);outline-offset:2px}
  .sdot{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
  .sitem.full .sdot{background:var(--water);border-color:var(--water);color:var(--on-ink)}
  .sitem[aria-current="step"] .sdot{border-color:var(--ink);color:var(--ink)}
  .sitem.full[aria-current="step"] .sdot{color:var(--on-ink)}
  .sname{font-size:14px;font-weight:600;line-height:1.25}
  .scount{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  .sidefoot{margin-top:14px;padding:14px;border-radius:16px;background:var(--sparkle);font-size:12.5px;line-height:1.45}
  .screen{padding-block:32px 16px;gap:20px}
  h1{font-size:46px}h2{font-size:38px}
  .blob{width:180px;right:4px;top:-14px}
  .q{padding:20px 22px}
  .qt h3{font-size:17.5px}
  .chip:hover:not([disabled]):not([aria-pressed="true"]){border-color:var(--water)}
  .check:hover,.mode:hover{border-color:var(--water)}
  .meta{grid-template-columns:1fr 1fr 200px}
  .checks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .actions{display:grid;grid-template-columns:1fr 1fr}
  .actions .mail{grid-column:1/-1}
  .preview{max-height:420px}
  .nav .wrap{max-width:1120px;justify-content:flex-end;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
  .nav .btn.primary{flex:0 0 auto;min-width:240px}
  .kbd{display:block;margin-right:auto;font-size:12.5px;color:var(--muted)}
  .kbd kbd{font-family:var(--font);font-size:11px;font-weight:700;border:1.5px solid var(--line);border-bottom-width:3px;border-radius:7px;padding:1px 7px;background:var(--card);color:var(--ink)}
  .toast{bottom:96px}
}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="brandrow">
      <svg class="logo" viewBox="0 0 102.5 26.6" role="img" aria-label="dough"><path class="ink" d="M7.64 4.24C9.26 4.24 10.64 4.66 11.81 5.38L11.81 1.01C11.81 0.38 12.23 -0.04 12.86 -0.04L14.20 -0.04C14.83 -0.04 15.25 0.38 15.25 1.01L15.25 18.45C15.25 19.08 14.83 19.50 14.20 19.50L12.23 19.50C11.96 19.50 11.81 19.32 11.81 19.08L11.81 18.69C10.64 19.41 9.26 19.83 7.64 19.83C2.76 19.83 0.00 16.41 0.00 12.04C0.00 7.66 2.76 4.24 7.64 4.24M7.64 16.53C10.19 16.53 11.81 14.67 11.81 12.04C11.81 9.40 10.19 7.54 7.64 7.54C5.06 7.54 3.45 9.37 3.45 12.04C3.45 14.70 5.06 16.53 7.64 16.53"/><path class="ink" d="M45.76 11.80L45.76 5.29C45.76 4.66 46.18 4.24 46.81 4.24L48.16 4.24C48.79 4.24 49.21 4.66 49.21 5.29L49.21 11.71C49.21 14.34 50.71 16.20 53.10 16.20C56.01 16.20 56.97 14.91 56.97 11.71L56.97 5.29C56.97 4.66 57.39 4.24 58.02 4.24L59.37 4.24C60.00 4.24 60.42 4.66 60.42 5.29L60.42 18.42C60.42 18.96 60.03 19.35 59.49 19.35L59.16 19.35C58.80 19.35 58.41 19.14 58.23 18.81L57.78 17.91C56.55 18.93 54.96 19.50 53.10 19.50C48.40 19.50 45.76 16.08 45.76 11.80"/><path class="ink" d="M70.76 4.24C72.31 4.24 74.05 4.93 74.89 5.89L74.89 5.14C74.89 4.69 75.19 4.39 75.64 4.39L77.29 4.39C77.92 4.39 78.34 4.81 78.34 5.44L78.34 16.17C78.34 21.60 75.67 26.30 69.17 26.30C67.55 26.30 66.17 26.03 64.82 25.43C64.28 25.19 64.10 24.62 64.37 24.08L64.85 23.12C65.06 22.67 65.42 22.46 65.81 22.46C66.02 22.46 66.23 22.52 66.44 22.61C67.28 22.97 68.24 23.21 69.14 23.21C72.22 23.21 73.81 21.89 74.47 18.93C73.39 19.50 72.13 19.83 70.76 19.83C65.87 19.83 63.11 16.41 63.11 12.04C63.11 7.66 65.87 4.24 70.76 4.24M70.76 16.53C73.33 16.53 74.89 14.70 74.89 11.98C74.89 9.37 73.27 7.54 70.76 7.54C68.18 7.54 66.56 9.37 66.56 12.04C66.56 14.70 68.18 16.53 70.76 16.53"/><path class="ink" d="M95.99 11.95L95.99 18.45C95.99 19.08 95.57 19.50 94.94 19.50L93.59 19.50C92.96 19.50 92.54 19.08 92.54 18.45L92.54 12.04C92.54 9.40 91.04 7.54 88.65 7.54C86.28 7.54 84.78 9.40 84.78 12.04L84.78 18.45C84.78 19.08 84.36 19.50 83.73 19.50L82.38 19.50C81.75 19.50 81.33 19.08 81.33 18.45L81.33 1.01C81.33 0.38 81.75 -0.04 82.38 -0.04L83.73 -0.04C84.36 -0.04 84.78 0.38 84.78 1.01L84.78 5.80C85.50 4.87 87.06 4.24 88.65 4.24C93.32 4.24 95.96 7.66 95.99 11.95"/><path class="ink" d="M99.33 4.51C101.02 4.51 102.00 5.66 102.00 7.15C102.00 8.63 101.02 9.78 99.33 9.78C97.65 9.78 96.66 8.63 96.66 7.15C96.66 5.66 97.65 4.51 99.33 4.51M99.33 9.31C100.67 9.31 101.50 8.42 101.50 7.15C101.50 5.88 100.67 4.98 99.33 4.98C98.00 4.98 97.17 5.88 97.17 7.15C97.17 8.42 98.00 9.31 99.33 9.31M99.36 5.53C99.75 5.53 100.07 5.64 100.33 5.84C100.46 5.94 100.46 6.10 100.34 6.22L100.23 6.32C100.17 6.39 100.10 6.41 100.01 6.41C99.95 6.41 99.88 6.39 99.80 6.35C99.68 6.28 99.53 6.23 99.36 6.23C98.84 6.23 98.52 6.60 98.52 7.15C98.52 7.70 98.84 8.06 99.36 8.06C99.57 8.06 99.75 7.98 99.89 7.88C99.97 7.82 100.06 7.78 100.14 7.78C100.20 7.78 100.27 7.81 100.34 7.87L100.45 7.98C100.57 8.08 100.58 8.24 100.47 8.35C100.19 8.62 99.83 8.76 99.36 8.76C98.35 8.76 97.79 8.05 97.79 7.15C97.79 6.25 98.35 5.53 99.36 5.53"/><path class="mark" d="M25.53 2.44C28.16 2.49 28.90 3.24 30.67 3.66C31.17 3.79 31.65 3.85 32.49 3.93C37.10 4.32 38.94 3.59 40.82 4.62C42.67 5.63 43.33 7.67 43.49 8.14C44.80 12.18 41.49 16.04 41.08 16.51C36.67 21.58 28.86 20.24 27.10 19.94C24.41 19.48 20.73 18.85 18.58 15.68C16.08 11.99 16.52 6.12 19.60 3.73C21.38 2.35 23.72 2.40 25.53 2.44"/></svg>
      <div class="pair"><b>brassbell</b> × dough<br>client questionnaire</div>
    </div>
    <div class="prog">
      <div class="segs" id="segs" aria-hidden="true"></div>
      <span class="count" id="count">0 / 24</span>
      <svg class="bell" id="bell" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="2.6" r="1.6"/><path d="M12 4.2c-3.9 0-6.6 3-6.6 7.1v3.6L3.6 17.6c-.4.6 0 1.4.8 1.4h15.2c.8 0 1.2-.8.8-1.4l-1.8-2.7v-3.6c0-4.1-2.7-7.1-6.6-7.1z"/><path d="M9.6 20.2h4.8a2.4 2.4 0 0 1-4.8 0z"/></svg>
    </div>
  </div>
</header>

<div class="shell"><aside class="side" id="side" aria-label="sections"></aside><main class="wrap" id="app" aria-live="polite"></main></div>

<nav class="nav" aria-label="questionnaire steps">
  <div class="wrap">
    <span class="kbd" id="kbd">use <kbd>←</kbd> <kbd>→</kbd> to move between sections</span><button class="btn ghost" id="back" type="button">back</button>
    <button class="btn primary" id="next" type="button">let's go</button>
  </div>
</nav>
<div class="toast" id="toast" role="status"></div>

<script>
// Brassbell × dough client questionnaire — content.
// type: multi (tap many), single (tap one), text (write), fields (short named inputs), groups (several tap-sets in one question)
// star = "start here"; max = pick-limit on multi; other = adds an "other" chip with its own input
const SECTIONS = [
  {
    key: "goals",
    eyebrow: "01 / discovery",
    title: "goals & priorities",
    sub: "what should the next 90 days deliver?",
    nudge: "the big-picture bit. tap what fits — we'll get specific later.",
    qs: [
      { id: "q01", star: true, type: "multi", max: 3, other: true,
        title: "what would make the first 90 days a win?",
        help: "pick up to three.",
        options: ["more direct bookings (fewer OTA fees)", "fuller rooms in low season", "higher nightly rates", "longer stays & repeat guests", "better reviews & ratings", "a strong launch for a new property", "more people at the café / F&B", "awareness for the brassbell group"] },
      { id: "q02", star: true, type: "multi", other: true,
        title: "which properties should dough cover first?",
        help: "tick every one in scope — add any we missed.",
        options: ["all of them", "Longchamps · Zamalek", "Hannaux House · Downtown", "Saint J · Abdeen", "brassbell apartments · Zamalek", "brassbell apartments · Downtown", "brassbell · New Cairo"] },
      { id: "q03", star: true, type: "multi", other: true,
        title: "which services do you need from dough?",
        options: ["strategy & content calendar", "photo & video shoots", "social posting & community", "paid ads", "influencer & creator collabs", "in-room & on-site materials", "brand guidelines review", "launches & events", "website & booking-page copy"] },
      { id: "q04", star: true, type: "groups",
        title: "what are your monthly budgets?",
        help: "a rough range is perfect. “to be agreed” is fine too.",
        groups: [
          { id: "ads", label: "paid ads / month", options: ["under 20k EGP", "20k–50k EGP", "50k–100k EGP", "100k+ EGP", "to be agreed"] },
          { id: "collabs", label: "influencers & collabs / month", options: ["none yet", "under 20k EGP", "20k–50k EGP", "50k+ EGP", "to be agreed"] }
        ] }
    ]
  },
  {
    key: "brand",
    eyebrow: "02 / discovery",
    title: "brand & identity",
    sub: "help us protect what makes brassbell, brassbell.",
    nudge: "we'd love to see your corporate guidelines — this is where they come in.",
    qs: [
      { id: "q05", star: true, type: "multi", other: true,
        title: "which brand assets exist today?",
        help: "we'll ask for the files at the end.",
        options: ["corporate brand guidelines", "vector logo files", "a sub-brand per property", "fonts & colour palette", "photo & video library", "tone-of-voice guide", "social or print templates", "nothing formal yet"] },
      { id: "q06", type: "multi", max: 3, other: true,
        title: "how should a stay at brassbell feel?",
        help: "pick the three words you'd want in a guest review.",
        options: ["heritage, old cairo", "design-led & artsy", "quiet luxury", "warm & homely", "local insider", "calm & restful", "social & lively", "playful"] },
      { id: "q07", star: true, type: "single", other: true,
        title: "how should the group and the properties relate?",
        options: ["one brassbell voice everywhere", "each property has its own personality, under brassbell", "properties lead, brassbell stays in the background", "not decided yet"] },
      { id: "q08", type: "text",
        title: "what must never change — or never appear?",
        help: "e.g. logo colours, building details, discount-led messaging, guest faces without consent.",
        placeholder: "the non-negotiables…" }
    ]
  },
  {
    key: "guests",
    eyebrow: "03 / discovery",
    title: "guests & stays",
    sub: "who checks in, and why do they pick you?",
    nudge: "think about the last few weeks of bookings.",
    qs: [
      { id: "q09", star: true, type: "multi", other: true,
        title: "who are your main guests?",
        options: ["international leisure travellers", "business travellers", "long stays & digital nomads", "egyptians on a staycation", "gulf visitors", "students & visiting academics", "couples", "families", "film & creative crews"] },
      { id: "q10", type: "groups",
        title: "where do bookings come from?",
        groups: [
          { id: "today", label: "today (tap all)", multi: true, options: ["booking.com", "expedia / hotels.com", "airbnb", "your website", "whatsapp & phone", "instagram DMs", "corporate & agencies"] },
          { id: "push", label: "the one we should push", options: ["your website", "whatsapp", "instagram DMs", "the OTAs", "corporate deals"] }
        ] },
      { id: "q11", type: "multi", other: true,
        title: "what do guests praise most?",
        options: ["the building & its story", "the interiors", "the location", "space & high ceilings", "cleanliness", "staff & service", "value for money", "the neighbourhood"],
        note: "and the most common complaint?" },
      { id: "q12", type: "text",
        title: "who do guests compare you with?",
        help: "other boutique hotels, airbnbs, chains — and why guests pick you (or them).",
        placeholder: "names, and why…" }
    ]
  },
  {
    key: "social",
    eyebrow: "04 / discovery",
    title: "social & channels",
    sub: "how brassbell shows up online.",
    nudge: "halfway there. the fun part's coming up.",
    qs: [
      { id: "q13", star: true, type: "multi", other: true,
        title: "which channels are live right now?",
        options: ["instagram", "facebook", "tiktok", "linkedin", "google business profiles", "website", "whatsapp business", "none yet"],
        note: "who can give dough access?" },
      { id: "q14", type: "groups",
        title: "how should brassbell sound?",
        groups: [
          { id: "lang", label: "language", multi: true, options: ["english", "egyptian arabic", "franco", "a mix"] },
          { id: "tone", label: "tone", options: ["elegant & minimal", "storytelling", "warm & personal", "witty"] }
        ] },
      { id: "q15", type: "groups",
        title: "which content, and how much AI?",
        groups: [
          { id: "formats", label: "formats you'd like (tap all)", multi: true, options: ["reels", "carousels", "photo posts", "stories", "room tours", "neighbourhood guides", "behind the scenes", "guest content"] },
          { id: "ai", label: "AI use", options: ["none", "moderate (concepts & mood; rooms stay real)", "heavy"] }
        ] },
      { id: "q16", type: "text",
        title: "what has worked — or flopped — before?",
        help: "posts, campaigns, offers or collabs. links welcome.",
        placeholder: "the hits and the misses…" }
    ]
  },
  {
    key: "stay",
    eyebrow: "05 / discovery",
    title: "in-room & collabs",
    sub: "the brand guests can touch, and the people around it.",
    nudge: "this is where a stay turns into a story.",
    qs: [
      { id: "q17", star: true, type: "multi", other: true,
        title: "which in-room & on-site pieces do you need?",
        options: ["welcome card / letter", "room guide with QR", "neighbourhood map & picks", "wifi & house-rules card", "door hangers", "review-request card", "café or room-service menu", "lobby & lift posters", "signage", "branded amenities & packaging"] },
      { id: "q18", star: true, type: "multi", other: true,
        title: "what kind of collaborations interest you?",
        options: ["travel influencers", "local creators", "artists & designers", "photographers", "nearby cafés & restaurants", "galleries & cultural spaces", "fashion & beauty brands", "corporate partners", "events & pop-ups"] },
      { id: "q19", star: true, type: "text",
        title: "any specific people or brands in mind?",
        help: "names or handles — even dream ones.",
        placeholder: "@handles, names, brands…" },
      { id: "q20", type: "multi", other: true,
        title: "what can a collaborator get?",
        options: ["complimentary nights", "discounted stays", "a paid fee", "dining & experiences", "space for their shoot", "to be agreed"] }
    ]
  },
  {
    key: "team",
    eyebrow: "06 / discovery",
    title: "people & ways of working",
    sub: "so decisions and content keep moving.",
    nudge: "last section. then you're done.",
    qs: [
      { id: "q21", star: true, type: "fields",
        title: "who is our day-to-day contact and final approver?",
        fields: [
          { id: "contact", label: "day-to-day contact · name & role" },
          { id: "approver", label: "final approver · name & role" },
          { id: "backup", label: "backup approver" }
        ] },
      { id: "q22", type: "groups",
        title: "how do you like to work?",
        groups: [
          { id: "speed", label: "review turnaround", options: ["same day", "24–48 hours", "within a week", "depends on the piece"] },
          { id: "channel", label: "best channel", options: ["whatsapp group", "email", "shared drive", "calls"] }
        ] },
      { id: "q23", type: "single", other: true,
        title: "who handles DMs, comments and reviews?",
        options: ["your team handles all of it", "dough replies on social", "dough drafts, you approve", "not set up yet"] },
      { id: "q24", type: "text",
        title: "what's coming up that we should plan for?",
        help: "openings, renovations, seasons, events — with dates if you have them.",
        placeholder: "dates and plans…" }
    ]
  }
];

const CHECKLIST = [
  ["f_brand", "brand guidelines & logo files", "vector logos, fonts, colours, per-property marks"],
  ["f_props", "property & room-type list", "addresses, room types, amenities, house rules"],
  ["f_media", "photo & video library", "approved shots and any usage limits"],
  ["f_rates", "rates & offer rules", "what we can and can't promote"],
  ["f_links", "booking & OTA links", "every page guests book from"],
  ["f_access", "social accounts & who owns access", "so we can be invited"],
  ["f_reports", "recent social or ad results", "last 90 days if you have them"],
  ["f_reviews", "guest review highlights", "best and worst, any platform"],
  ["f_calendar", "events & launch calendar", "the next three months"]
];

(function(){
  const KEY="brassbell-dough-questionnaire-v1";
  const EMAIL="yahia@xdough.com";
  const BLOB='<svg class="blob" viewBox="0 0 120 90" aria-hidden="true"><path d="M58 8c22 1 25 6 38 9 13 3 22 14 20 33-2 22-25 34-55 34C29 84 6 70 4 46 2 22 22 8 40 8c8 0 12 0 18 0z"/></svg>';
  const WAVE='<svg class="wave" viewBox="0 0 595.28 63.89" preserveAspectRatio="none" aria-hidden="true"><path class="w" d="M0.00 63.89L0.00 31.89C110.00 44.89 180.00 2.89 277.00 14.89C390.00 28.89 466.00 57.89 595.28 28.89L595.28 63.89L0.00 63.89"/><path class="b" d="M515.28 63.89C528.28 52.89 565.28 40.89 595.28 44.89L595.28 63.89L515.28 63.89"/></svg>';
  const BELLSVG='<circle cx="12" cy="2.6" r="1.6"/><path d="M12 4.2c-3.9 0-6.6 3-6.6 7.1v3.6L3.6 17.6c-.4.6 0 1.4.8 1.4h15.2c.8 0 1.2-.8.8-1.4l-1.8-2.7v-3.6c0-4.1-2.7-7.1-6.6-7.1z"/><path d="M9.6 20.2h4.8a2.4 2.4 0 0 1-4.8 0z"/>';
  const ALLQ=SECTIONS.flatMap(s=>s.qs);

  let S={step:0,mode:"full",meta:{name:"",role:"",date:new Date().toISOString().slice(0,10)},a:{},files:{},links:"",pending:""};
  try{const raw=localStorage.getItem(KEY); if(raw){const v=JSON.parse(raw); if(v&&typeof v==="object") S=Object.assign(S,v);}}catch(e){}
  let saveT=null;
  function save(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}},250);}

  const app=document.getElementById("app"), nextB=document.getElementById("next"), backB=document.getElementById("back");
  const STEPS=1+SECTIONS.length+1+1; // intro, 6 sections, files, done
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const ans=id=>(S.a[id]||(S.a[id]={sel:[],other:"",note:"",text:"",g:{},f:{}}));
  const visible=s=>s.qs.filter(q=>S.mode==="full"||q.star);

  function answered(q){
    const a=S.a[q.id]; if(!a) return false;
    if(q.type==="text") return !!(a.text||"").trim();
    if(q.type==="fields") return q.fields.some(f=>(a.f[f.id]||"").trim());
    if(q.type==="groups") return q.groups.some(g=>(a.g[g.id]||[]).length);
    return a.sel.length>0||!!(a.other||"").trim();
  }
  function totals(){const qs=ALLQ.filter(q=>S.mode==="full"||q.star);return {done:qs.filter(answered).length,all:qs.length};}

  // progress bar
  const segs=document.getElementById("segs");
  segs.innerHTML=Array.from({length:7},()=>'<div class="seg"><i></i></div>').join("");
  let lastFull=new Set();
  function progress(){
    const t=totals(); document.getElementById("count").textContent=t.done+" / "+t.all;
    const nodes=segs.children;
    SECTIONS.forEach((s,i)=>{const v=visible(s);const d=v.filter(answered).length;nodes[i].firstChild.style.width=(v.length?d/v.length*100:0)+"%";nodes[i].classList.toggle("here",S.step===i+1);
      const full=v.length&&d===v.length; if(full&&!lastFull.has(i)){lastFull.add(i);ringSmall();} if(!full) lastFull.delete(i);});
    const fc=Object.values(S.files).filter(Boolean).length;
    nodes[6].firstChild.style.width=Math.min(100,fc/CHECKLIST.length*100)+"%"; nodes[6].classList.toggle("here",S.step===7);
    if(typeof renderSide==="function") renderSide();
  }
  let primed=false;
  function ringSmall(){if(!primed) return;const b=document.getElementById("bell");b.classList.remove("ring");void b.offsetWidth;b.classList.add("ring");}

  function chip(label,on,attrs){return '<button type="button" class="chip" aria-pressed="'+(on?"true":"false")+'" '+attrs+'>'+esc(label)+'</button>';}

  function qHTML(q,n){
    const a=ans(q.id); let body="";
    if(q.type==="multi"||q.type==="single"){
      const atMax=q.max&&a.sel.length>=q.max;
      body+='<div class="chips" role="group" aria-label="'+esc(q.title)+'">'+q.options.map(o=>{const on=a.sel.includes(o);return chip(o,on,'data-q="'+q.id+'" data-v="'+esc(o)+'"'+(atMax&&!on&&q.type==="multi"?" disabled":""));}).join("");
      if(q.other) body+='<button type="button" class="chip other" aria-pressed="'+(a.showOther||a.other?"true":"false")+'" data-other="'+q.id+'">other…</button>';
      body+='</div>';
      if(q.max) body+='<p class="limit">'+a.sel.length+' of '+q.max+' picked</p>';
      if(q.other&&(a.showOther||a.other)) body+='<input type="text" id="'+q.id+'-other" data-otherinput="'+q.id+'" placeholder="tell us more" value="'+esc(a.other)+'">';
      if(q.note) body+='<div class="notelabel">'+esc(q.note)+'</div><input type="text" id="'+q.id+'-note" data-note="'+q.id+'" placeholder="optional" value="'+esc(a.note)+'">';
    } else if(q.type==="groups"){
      body+=q.groups.map(g=>{const sel=a.g[g.id]||[];return '<div class="glabel">'+esc(g.label)+'</div><div class="chips" role="group" aria-label="'+esc(g.label)+'">'+g.options.map(o=>chip(o,sel.includes(o),'data-q="'+q.id+'" data-g="'+g.id+'" data-multi="'+(g.multi?1:0)+'" data-v="'+esc(o)+'"')).join("")+'</div>';}).join("");
      body+='<input type="text" id="'+q.id+'-note" data-note="'+q.id+'" placeholder="anything to add? (optional)" value="'+esc(a.note)+'">';
    } else if(q.type==="text"){
      body+='<textarea id="'+q.id+'-text" data-text="'+q.id+'" placeholder="'+esc(q.placeholder||"")+'">'+esc(a.text)+'</textarea>';
    } else if(q.type==="fields"){
      body+=q.fields.map(f=>'<div class="field"><label for="'+q.id+'-'+f.id+'">'+esc(f.label)+'</label><input type="text" id="'+q.id+'-'+f.id+'" data-field="'+q.id+'" data-f="'+f.id+'" value="'+esc(a.f[f.id]||"")+'"></div>').join("");
    }
    return '<article class="q'+(answered(q)?" done":"")+'" id="card-'+q.id+'"><div class="qhead"><span class="qn">'+q.id.slice(1)+'</span><div class="qt"><h3>'+esc(q.title)+'</h3>'+(q.help?'<p>'+esc(q.help)+'</p>':"")+'</div>'+(q.star?'<span class="star">start here</span>':"")+'<span class="tick" aria-hidden="true">✓</span></div>'+body+'</article>';
  }

  function render(focusTop){
    const st=S.step; let h="";
    if(st===0){
      h='<section class="screen fade"><div class="hero">'+BLOB+'<span class="eyebrow">welcome, brassbell</span><h1>let\'s get to know your stays.</h1><p class="sub">a few taps now, and our first plan fits brassbell from day one.</p></div>'+
        '<p class="nudge">mostly tap-to-answer. your answers save on this phone as you go, so you can stop and come back anytime.</p>'+
        '<div class="field"><label>pick your pace</label></div><div class="modes">'+
        '<button type="button" class="mode" data-mode="quick" aria-pressed="'+(S.mode==="quick")+'"><b>quick</b><span>12 “start here” questions · about 4 min</span></button>'+
        '<button type="button" class="mode" data-mode="full" aria-pressed="'+(S.mode==="full")+'"><b>full</b><span>all 24 questions · about 10 min</span></button></div>'+
        '<ul class="howto"><li><span>1</span><span>tap every option that fits. use <b>other…</b> for anything we missed.</span></li><li><span>2</span><span>skip what you\'re unsure of. we\'ll cover it at kickoff.</span></li><li><span>3</span><span>at the end, send your answers to dough on whatsapp or by email.</span></li></ul>'+
        '<div class="meta"><div class="field"><label for="m-name">your name</label><input type="text" id="m-name" data-meta="name" value="'+esc(S.meta.name)+'" autocomplete="name"></div>'+
        '<div class="field"><label for="m-role">role / team</label><input type="text" id="m-role" data-meta="role" value="'+esc(S.meta.role)+'" autocomplete="organization-title"></div>'+
        '<div class="field"><label for="m-date">date</label><input type="date" id="m-date" data-meta="date" value="'+esc(S.meta.date)+'"></div></div>'+WAVE+'</section>';
    } else if(st<=SECTIONS.length){
      const s=SECTIONS[st-1];
      h='<section class="screen fade"><div class="hero">'+BLOB+'<span class="eyebrow">'+esc(s.eyebrow)+'</span><h2>'+esc(s.title)+'</h2><p class="sub">'+esc(s.sub)+'</p></div><p class="nudge">'+esc(s.nudge)+'</p>'+visible(s).map(q=>qHTML(q)).join("")+'</section>';
    } else if(st===SECTIONS.length+1){
      h='<section class="screen fade"><div class="hero">'+BLOB+'<span class="eyebrow">07 / files & next steps</span><h2>what to share</h2><p class="sub">tick what you can send. no need to make anything new.</p></div><div class="checks">'+
        CHECKLIST.map(([id,t,d])=>'<button type="button" class="check" data-file="'+id+'" aria-pressed="'+(!!S.files[id])+'"><span class="box">✓</span><span><b>'+esc(t)+'</b><small>'+esc(d)+'</small></span></button>').join("")+'</div>'+
        '<div class="field"><label for="f-links">shared folder or links</label><textarea id="f-links" data-misc="links" placeholder="google drive, dropbox, website…">'+esc(S.links)+'</textarea></div>'+
        '<div class="field"><label for="f-pending">still pending? who owns it, and when?</label><textarea id="f-pending" data-misc="pending" placeholder="e.g. brand book — marketing team — next week">'+esc(S.pending)+'</textarea></div></section>';
    } else {
      const t=totals(); const fc=Object.values(S.files).filter(Boolean).length;
      const skipped=ALLQ.filter(q=>(S.mode==="full"||q.star)&&q.star&&!answered(q));
      h='<section class="screen fade"><div class="hero done-hero"><svg class="bigbell" id="bigbell" viewBox="0 0 24 24" aria-hidden="true">'+BELLSVG+'</svg><span class="eyebrow">ding!</span><h2>that\'s everything.</h2><p class="sub">thank you, '+esc(S.meta.name||"brassbell team")+'. one last tap sends it all to dough.</p></div>'+
        '<div class="stats"><div class="stat"><b>'+t.done+'</b><span>of '+t.all+' answered</span></div><div class="stat"><b>'+(12-skipped.length)+'</b><span>of 12 start-here</span></div><div class="stat"><b>'+fc+'</b><span>files to share</span></div></div>'+
        (skipped.length?'<p class="missing">'+skipped.length+' start-here question'+(skipped.length>1?"s are":" is")+' still open. <button type="button" id="jump">answer '+(skipped.length>1?"them":"it")+'</button>, or send as is.</p>':"")+
        '<div class="actions"><a class="btn wa full" id="wa" href="#" target="_blank" rel="noopener">send on whatsapp</a><button type="button" class="btn ghost full" id="copy">copy all answers</button>'+
        '<div class="mail"><span>or paste them in an email to</span><code>'+EMAIL+'</code></div></div>'+
        '<div class="field"><label>what we\'ll receive</label></div><div class="preview" id="pv">'+esc(summary())+'</div>'+WAVE+'</section>';
    }
    app.innerHTML=h;
    backB.hidden=st===0;
    nextB.hidden=st===STEPS-1;
    nextB.textContent=st===0?"let's go":st===SECTIONS.length?"almost done":st===SECTIONS.length+1?"finish":"next section";
    if(st===STEPS-1){const wa=document.getElementById("wa");wa.href="https://wa.me/?text="+encodeURIComponent(summary());
      if(primed){const bb=document.getElementById("bigbell");bb.classList.add("ring");}}
    progress();
    if(focusTop) window.scrollTo({top:0,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});
  }

  function refreshCard(qid){
    const q=ALLQ.find(x=>x.id===qid); const el=document.getElementById("card-"+qid); if(!q||!el) return;
    const act=document.activeElement&&document.activeElement.id;
    el.outerHTML=qHTML(q);
    if(act){const f=document.getElementById(act); if(f){f.focus(); if(f.setSelectionRange&&f.value) try{f.setSelectionRange(f.value.length,f.value.length);}catch(e){}}}
    progress();
  }
  function markCard(qid){const q=ALLQ.find(x=>x.id===qid);const el=document.getElementById("card-"+qid);if(q&&el) el.classList.toggle("done",answered(q));progress();}

  app.addEventListener("click",e=>{
    const m=e.target.closest("[data-mode]"); if(m){S.mode=m.dataset.mode;save();render();return;}
    const f=e.target.closest("[data-file]"); if(f){S.files[f.dataset.file]=!S.files[f.dataset.file];f.setAttribute("aria-pressed",!!S.files[f.dataset.file]);save();progress();return;}
    if(e.target.id==="copy"){copy();return;}
    if(e.target.id==="jump"){const sk=ALLQ.find(q=>q.star&&!answered(q));const si=SECTIONS.findIndex(s=>s.qs.includes(sk));S.step=si+1;save();render(true);setTimeout(()=>{const c=document.getElementById("card-"+sk.id);if(c)c.scrollIntoView({block:"center"});},60);return;}
    const o=e.target.closest("[data-other]"); if(o){const a=ans(o.dataset.other);a.showOther=!(a.showOther||a.other);if(!a.showOther)a.other="";if(a.showOther&&q(o.dataset.other).type==="single")a.sel=[];save();refreshCard(o.dataset.other);const i=document.getElementById(o.dataset.other+"-other");if(i)i.focus();return;}
    const c=e.target.closest(".chip[data-q]"); if(!c||c.disabled) return;
    const qq=q(c.dataset.q), a=ans(c.dataset.q), v=c.dataset.v;
    if(c.dataset.g){const g=c.dataset.g;let sel=a.g[g]||[];if(c.dataset.multi==="1"){sel=sel.includes(v)?sel.filter(x=>x!==v):sel.concat(v);}else{sel=sel.includes(v)?[]:[v];}a.g[g]=sel;}
    else if(qq.type==="single"){a.sel=a.sel.includes(v)?[]:[v];a.showOther=false;a.other="";}
    else{a.sel=a.sel.includes(v)?a.sel.filter(x=>x!==v):a.sel.concat(v);}
    save();refreshCard(c.dataset.q);
  });
  app.addEventListener("input",e=>{
    const t=e.target,d=t.dataset;
    if(d.meta){S.meta[d.meta]=t.value;progress();}
    else if(d.otherinput){ans(d.otherinput).other=t.value;markCard(d.otherinput);}
    else if(d.note){ans(d.note).note=t.value;}
    else if(d.text){ans(d.text).text=t.value;markCard(d.text);}
    else if(d.field){ans(d.field).f[d.f]=t.value;markCard(d.field);}
    else if(d.misc){S[d.misc]=t.value;}
    save();
  });
  function q(id){return ALLQ.find(x=>x.id===id);}

  const side=document.getElementById("side");
  const STEPNAMES=["welcome"].concat(SECTIONS.map(s=>s.title),["what to share","send it"]);
  function renderSide(){
    if(getComputedStyle(side).display==="none"){side.innerHTML="";return;}
    let h='<h4>your progress</h4>';
    STEPNAMES.forEach((n,i)=>{
      let cnt="",full=false;
      if(i>=1&&i<=SECTIONS.length){const v=visible(SECTIONS[i-1]);const d=v.filter(answered).length;cnt=d+"/"+v.length;full=v.length>0&&d===v.length;}
      else if(i===SECTIONS.length+1){const fc=Object.values(S.files).filter(Boolean).length;cnt=fc+"/"+CHECKLIST.length;full=fc>0;}
      else if(i===0){full=!!(S.meta.name||"").trim();}
      const mark=full?"✓":(i===0?"·":i===STEPNAMES.length-1?"✉":String(i));
      h+='<button type="button" class="sitem'+(full?" full":"")+'" data-step="'+i+'"'+(S.step===i?' aria-current="step"':"")+'><span class="sdot">'+mark+'</span><span class="sname">'+esc(n)+'</span><span class="scount">'+cnt+'</span></button>';
    });
    h+='<div class="sidefoot">jump to any section. your answers save in this browser as you type.</div>';
    side.innerHTML=h;
  }
  side.addEventListener("click",e=>{const b=e.target.closest("[data-step]");if(!b)return;primed=true;S.step=+b.dataset.step;save();render(true);});
  addEventListener("resize",()=>renderSide());
  document.addEventListener("keydown",e=>{
    if(e.altKey||e.ctrlKey||e.metaKey||e.shiftKey) return;
    const tg=e.target; if(tg&&(tg.tagName==="INPUT"||tg.tagName==="TEXTAREA"||tg.isContentEditable)) return;
    if(e.key==="ArrowRight"&&S.step<STEPS-1){e.preventDefault();nextB.click();}
    else if(e.key==="ArrowLeft"&&S.step>0){e.preventDefault();backB.click();}
  });

  function summary(){
    const L=[]; L.push("BRASSBELL × DOUGH — CLIENT QUESTIONNAIRE");
    L.push("completed by: "+(S.meta.name||"—")+(S.meta.role?" ("+S.meta.role+")":"")+" · "+(S.meta.date||""));
    SECTIONS.forEach(s=>{L.push("");L.push("— "+s.title.toUpperCase()+" —");
      s.qs.forEach(qq=>{if(!answered(qq)) return; const a=S.a[qq.id]; let line="";
        if(qq.type==="text") line=a.text.trim();
        else if(qq.type==="fields") line=qq.fields.filter(f=>(a.f[f.id]||"").trim()).map(f=>f.label.split(" · ")[0]+": "+a.f[f.id].trim()).join(" | ");
        else if(qq.type==="groups") line=qq.groups.filter(g=>(a.g[g.id]||[]).length).map(g=>g.label+": "+a.g[g.id].join(", ")).join(" | ");
        else line=a.sel.concat(a.other&&a.other.trim()?["other: "+a.other.trim()]:[]).join(", ");
        if(a.note&&a.note.trim()) line+=(line?" | ":"")+(qq.note||"note")+": "+a.note.trim();
        L.push(qq.id.slice(1)+". "+qq.title); L.push("→ "+line);});});
    const fl=CHECKLIST.filter(([id])=>S.files[id]).map(([,t])=>t);
    L.push("");L.push("— FILES WE'LL SHARE —");L.push(fl.length?fl.map(x=>"• "+x).join("\n"):"—");
    if(S.links.trim()) L.push("links: "+S.links.trim());
    if(S.pending.trim()) L.push("pending: "+S.pending.trim());
    return L.join("\n");
  }
  function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2200);}
  function copy(){
    const txt=summary();
    const fallback=()=>{const pv=document.getElementById("pv");if(pv){const r=document.createRange();r.selectNodeContents(pv);const s=getSelection();s.removeAllRanges();s.addRange(r);}toast("answers selected. copy them from your keyboard menu");};
    try{navigator.clipboard.writeText(txt).then(()=>toast("copied. paste it into whatsapp or email"),fallback);}catch(e){fallback();}
  }

  nextB.addEventListener("click",()=>{primed=true;if(S.step<STEPS-1){S.step++;save();render(true);}});
  backB.addEventListener("click",()=>{primed=true;if(S.step>0){S.step--;save();render(true);}});
  SECTIONS.forEach((s,i)=>{const v=visible(s);if(v.length&&v.every(answered))lastFull.add(i);});
  render(false);
})();
</script>

</body>
